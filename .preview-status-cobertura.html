<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Status de token — pré-visualização</title>
    <style>
      body {
        background: #1b1f27;
        color: #e6e8ec;
        font-family: system-ui, sans-serif;
        display: flex;
        gap: 40px;
        padding: 32px;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      img {
        width: 110px;
        height: 110px;
        display: block;
      }
      figcaption {
        margin-top: 10px;
        font-size: 13px;
        color: #9aa3b2;
        line-height: 1.5;
      }
      code {
        color: #cfd6e4;
      }
    </style>
  </head>
  <body>
    <figure>
      <img src="./public/status-icons/softcover.svg" alt="Cobertura Leve" />
      <figcaption>
        <code>softcover</code> — Cobertura Leve<br />
        escudo meio cheio · verde
      </figcaption>
    </figure>
    <figure>
      <img src="./public/status-icons/hardcover.svg" alt="Cobertura Pesada" />
      <figcaption>
        <code>hardcover</code> — Cobertura Pesada<br />
        escudo cheio · vermelho
      </figcaption>
    </figure>
    <figure>
      <img src="./public/status-icons/intangible.svg" alt="Intangível" />
      <figcaption>
        <code>intangible</code> — Intangível<br />
        losango (ícone do pack ktb) · roxo
      </figcaption>
    </figure>
  </body>
</html>
