<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ícone do menu de contexto: "ativar/desativar registro de movimento".
       O Owlbear renderiza `icon` como IMAGEM (não aceita fonte MDI), então o ícone
       precisa ser SVG estático. Desenho próprio (círculo + triângulo de play) para não
       depender de nenhuma fonte, com halo escuro para ler sobre mapa claro. -->
  <g fill="none" stroke="#000000" stroke-width="12" stroke-linejoin="round">
    <circle cx="50" cy="50" r="37" />
    <path d="M41 30 L74 50 L41 70 Z" fill="#000000" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <circle cx="50" cy="50" r="37" />
    <path d="M41 30 L74 50 L41 70 Z" fill="#ffffff" />
  </g>
</svg>
