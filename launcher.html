<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMP/CON Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <!-- Pré-carregamento dos recursos essenciais da janela principal -->
    <link rel="prefetch" href="/index.html" as="document" />
    <link rel="prefetch" href="/content/pt/lancer-data.json" as="fetch" crossorigin="anonymous" />
    <link rel="prefetch" href="/content/pt/lancer-srd.json" as="fetch" crossorigin="anonymous" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      .launcher-container {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100vw;
        height: 100vh;
        padding: 14px 16px;
        background: #14171d;
        border: 1px solid rgba(224, 40, 79, 0.4);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 0 16px rgba(0, 0, 0, 0.4);
      }
      .launcher-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .launcher-icon {
        width: 28px;
        height: 28px;
        filter: drop-shadow(0 0 6px rgba(224, 40, 79, 0.6));
        flex-shrink: 0;
      }
      .launcher-info {
        display: flex;
        flex-direction: column;
      }
      .launcher-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: #f1f2f6;
        line-height: 1.2;
      }
      .launcher-title span {
        color: #e0284f;
      }
      .launcher-status {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        color: #7f8c8d;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #2ed573;
        box-shadow: 0 0 6px #2ed573;
      }
      .btn-launch {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(135deg, #e0284f 0%, #b31d3b 100%);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 9px 12px;
        font-family: 'Rajdhani', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 12px rgba(224, 40, 79, 0.35);
        outline: none;
      }
      .btn-launch:hover {
        background: linear-gradient(135deg, #ff335c 0%, #c41e40 100%);
        box-shadow: 0 6px 16px rgba(224, 40, 79, 0.55), 0 0 10px rgba(224, 40, 79, 0.4);
        transform: translateY(-1px);
      }
      .btn-launch:active {
        transform: translateY(1px);
        box-shadow: 0 2px 6px rgba(224, 40, 79, 0.4);
      }
      .btn-launch svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }
      .launcher-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .btn-sheets {
        background: linear-gradient(135deg, #1f242e 0%, #11141b 100%);
        border: 1px solid rgba(224, 40, 79, 0.45);
        color: #f1f2f6;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      }
      .btn-sheets:hover {
        background: linear-gradient(135deg, rgba(224, 40, 79, 0.3) 0%, rgba(224, 40, 79, 0.12) 100%);
        border-color: #e0284f;
        box-shadow: 0 6px 14px rgba(224, 40, 79, 0.35);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="launcher-container" style="display: none;">
      <div class="launcher-header">
        <img src="/icon.svg" alt="COMP/CON" class="launcher-icon" />
        <div class="launcher-info">
          <div class="launcher-title">COMP/CON <span>ATIVO</span></div>
          <div class="launcher-status">
            <span class="status-dot"></span>
            <span id="status-text">Pronto para lançar</span>
          </div>
        </div>
      </div>

      <div class="launcher-actions">
        <button id="open-window-btn" class="btn-launch" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          <span id="btn-text">Abrir Janela</span>
        </button>

        <button id="open-sheets-btn" class="btn-launch btn-sheets" type="button" title="Gerenciar todas as fichas da mesa (Mestre)">
          <svg viewBox="0 0 24 24">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
          <span id="btn-sheets-text">Fichas da Mesa</span>
        </button>
      </div>
    </div>

    <script type="module" src="/src/launcher.ts"></script>
  </body>
</html>
